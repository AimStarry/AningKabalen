events {}

http {

    client_max_body_size 20M;

    upstream frontend {
        server aningkabalen-frontend:80;
    }

    upstream backend {
        server aningkabalen-backend:5000;
    }

    #
    # HTTP -> HTTPS redirect
    #
    server {
	listen 80;
       	server_name aningkabalen.site www.aningkabalen.site;

	return 301 https://$host$request_uri;
    }

    #
    # HTTPS
    #
    server {
        listen 443 ssl;
	server_name aningkabalen.site www.aningkabalen.site;

	ssl_certificate /etc/letsencrypt/live/aningkabalen.site/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/aningkabalen.site/privkey.pem;

        location / {
            proxy_pass http://frontend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
